<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Залишити заявку - Флора &amp; Декор</title>
    <style>
        body { margin: 0; background: #F6F3EE; color: #26332B; font-family: Arial, sans-serif; }
        .container { max-width: 560px; margin: 0 auto; padding: 0 20px 40px; }
        header { padding: 24px 0; font-size: 28px; font-weight: bold; }
        header a { color: inherit; text-decoration: none; }
        h1 { font-size: 32px; margin: 8px 0 8px; }
        p.lead { color: #4A5A50; margin: 0 0 24px; }
        .field { margin-bottom: 18px; }
        label { display: block; font-size: 14px; margin-bottom: 6px; }
        input, select, textarea { width: 100%; box-sizing: border-box; padding: 12px; font-size: 16px; border: 1px solid #C9D3C8; border-radius: 10px; background: #fff; font-family: inherit; }
        .errorlist { color: #B3392B; font-size: 14px; list-style: none; padding: 0; margin: 6px 0 0; }
        button { width: 100%; background: #C9776B; color: #fff; border: 0; padding: 16px; font-size: 16px; border-radius: 999px; cursor: pointer; }
        .back { display: inline-block; margin-top: 20px; color: #4A5A50; font-size: 14px; }
    </style>
</head>
<body>
    <div class="container">
        <header><a href="/">Флора &amp; Декор</a></header>

        <h1>Залишити заявку</h1>
        <p class="lead">Опишіть подію, і я зв'яжуся з вами, щоб обговорити деталі та вартість.</p>

        <form method="post">
            {% csrf_token %}
            {% for field in form %}
                <div class="field">
                    <label for="{{ field.id_for_label }}">{{ field.label }}</label>
                    {{ field }}
                    {{ field.errors }}
                </div>
            {% endfor %}
            <button type="submit">Відправити заявку</button>
        </form>

        <a class="back" href="/">Повернутися на головну</a>
    </div>
</body>
</html>
